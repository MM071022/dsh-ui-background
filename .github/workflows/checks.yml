name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run simulated browser and contract checks
        run: |
          node checks/all-features-test.mjs
          node checks/v4-full-check.mjs
          node checks/scoped-css-check.mjs
          node checks/bundle-contract-check.mjs
          node checks/css-generation-check.mjs
